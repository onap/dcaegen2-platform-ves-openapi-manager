---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# SonarQube Cloud branch analysis for dcaegen2/platform/ves-openapi-manager.
#
# Replaces the Jenkins job dcaegen2-platform-ves-openapi-manager-sonar (global-jjb template
# gerrit-maven-sonar): a weekly scan of master plus an on-demand run,
# reporting to onap_dcaegen2-platform-ves-openapi-manager in organisation onap.
#
# This lane writes the project's OWN branch analysis -- the headline
# numbers on the SonarCloud dashboard. That is what it is for, and it is
# also why it carries more risk than a per-patchset lane, which only
# ever writes a throwaway branch. Read the analysis_mode note below
# before changing anything here.
#
# It does not vote. The Jenkins job it replaces sets skip-vote on every
# outcome, so Sonar has never gated a change in this project, and this
# lane does not start.
name: 'SonarCloud Analysis'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Weekly, matching the Jenkins job's 'H H * * 6'. An odd minute lets
    # GitHub's queue randomise the exact start.
    - cron: "22 3 * * 6"

  # Stands in for the Jenkins job's on-demand trigger, a 'run-sonar'
  # comment on a Gerrit change.
  workflow_dispatch:
    # The GERRIT_* inputs are declared but unused. gerrit_to_platform
    # matches workflow filenames on substrings -- 'gerrit' plus the event
    # filter -- and 'sonarcloud' contains 'sonar', so a comment mapping
    # for a 'sonar' filter would dispatch this file with all nine inputs.
    # GitHub rejects a dispatch carrying inputs the workflow does not
    # declare, so declaring them keeps that path from failing.
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''

concurrency:
  # The workflow name is part of the group because the group is
  # repository-wide, and without it separate lanes would cancel each
  # other on the same ref.
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  sonarqube-cloud:
    name: 'SonarCloud Analysis'
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/sonarqube-cloud.yaml@5882f138dd24fcd6cb4ebc8bb3a68cee45a437a6  # v0.3.0
    with:
      # Same SonarCloud project the Jenkins job reports to, so the
      # migration does not fork the analysis history.
      sonar_organization: 'onap'
      sonar_project_key: 'onap_dcaegen2-platform-ves-openapi-manager'
      #
      # sonar_branch_name and sonar_branch_target are deliberately unset.
      # global-jjb/shell/maven-sonar.sh only sets sonar.branch.name when
      # SCAN_DEV_BRANCH is true, which this template leaves false, so the
      # Jenkins job passes nothing but projectKey, organization and token
      # and lets Sonar resolve the branch. Matching that keeps this lane
      # writing the same analysis the Jenkins job does.
      #
      # Build before analysing so the Java analyser sees bytecode and the
      # JaCoCo report; a source-only scan reports no coverage. Phases
      # match the Jenkins job's 'clean install'. java_version is left
      # unset so the lane detects the project's JDK rather than pinning a
      # value that can drift out of step with the POMs.
      #
      # analysis_mode is deliberately unset so security-workflows derives
      # sonar-maven-plugin from build_type. This matters more here than
      # anywhere else in the migration: the Scanner CLI walks
      # target/generated-sources and reports findings against generated
      # code, and on ONAP cps/ncmp-dmi-plugin that moved the project from
      # 0 bugs to 1157 while still reporting success. A per-patchset lane
      # writing a throwaway branch can absorb that mistake. This lane
      # writes the project's own analysis, so it cannot.
      build_type: 'maven'
      mvn_phases: 'clean install'
      mvn_params: '-Djib.skip=true --fail-at-end'
      #
      # The Jenkins job leaves sonarcloud-qualitygate-wait false, so the
      # gate has never been awaited or enforced for this project. Neither
      # is done here.
      wait_for_quality_gate: false
      fail_on_quality_gate: false
      #
      # Maven pulls from artifact CDNs that are impractical to enumerate
      # in the allow-list, and the build shares this job with the scan.
      build_permit_egress_traffic: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      # The organisation's authoritative Maven settings, which define the
      # onap-public mirror. It carries no credentials and needs none: the
      # ONAP public group serves anonymously, and this lane only resolves
      # dependencies, never deploys.
      maven_global_settings: ${{ vars.MVN_GLOBAL_SETTINGS }}
